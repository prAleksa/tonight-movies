<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Сегодня вечером</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <base href="/tonight-movies/" />
    <link rel="stylesheet" href="styles.css?v=3" />
  </head>
  <body>
    <div class="page">
      <div class="shell">
        <header class="topbar">
          <a class="brand" href="index.html">Сегодня вечером</a>
          <nav class="topnav">
            <button type="button" class="linkish" id="openFavs">
              Избранное <span id="favCount">0</span>
            </button>
            <button type="button" class="btn btn--primary" id="openRoulette">
              Рулетка
            </button>
          </nav>
        </header>

        <section class="hero">
          <p class="hero__role">Выбор фильма без мучений</p>
          <h1 class="hero__name">Что смотрим сегодня?</h1>
          <p class="hero__text">
            Сохраняй то, что откликается. Если выбирать лень — крути рулетку
            по избранному или по фильтрам.
          </p>
        </section>

        <section class="toolbar" aria-label="Фильтры">
          <div class="field">
            <label for="mood">Настроение</label>
            <select id="mood"></select>
          </div>
          <div class="field">
            <label for="time">Время</label>
            <select id="time"></select>
          </div>
          <div class="field">
            <label for="genre">Жанр</label>
            <select id="genre"></select>
          </div>
          <div class="field">
            <label for="country">Страна</label>
            <select id="country"></select>
          </div>
          <button type="button" class="btn btn--ghost" id="resetFilters">Сбросить</button>
        </section>

        <p class="count" id="resultCount"></p>
        <section class="works" id="catalog" aria-live="polite"></section>
      </div>
    </div>

    <div class="modal" id="rouletteModal" hidden>
      <div class="modal__card">
        <button type="button" class="modal__close" id="closeRoulette" aria-label="Закрыть">×</button>
        <h2 class="modal__title">Рулетка на вечер</h2>
        <p class="modal__note">Случайный фильм — из того, что уже отфильтровано, или только из лайков.</p>
        <div class="segment" role="group" aria-label="Источник рулетки">
          <button type="button" class="segment__btn is-active" data-source="filters">По фильтрам</button>
          <button type="button" class="segment__btn" data-source="favorites">Из избранного</button>
        </div>
        <p class="modal__pool" id="roulettePool"></p>
        <div class="roulette-stage" id="rouletteStage">
          <p class="roulette-stage__hint">Нажми «Крутить»</p>
        </div>
        <div class="modal__actions">
          <button type="button" class="btn btn--primary" id="spinBtn">Крутить</button>
          <a class="btn btn--ghost" id="goMovie" hidden href="#">Открыть фильм</a>
        </div>
      </div>
    </div>

    <script type="module" src="catalog.js?v=3"></script>
  </body>
</html>
