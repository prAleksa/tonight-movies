<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Сегодня вечером</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,450;9..144,550;9..144,650&family=Syne:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <base href="/tonight-movies/" />
    <link rel="stylesheet" href="styles.css?v=5" />
  </head>
  <body>
    <div class="page">
      <div class="shell">
        <header class="topbar">
          <a class="brand" href="index.html">Сегодня вечером</a>
          <nav class="topnav">
            <button type="button" class="linkish" id="openFavs">
              Избранное <span id="favCount">0</span>
            </button>
            <button type="button" class="btn btn--primary" id="openRoulette">Рулетка</button>
          </nav>
        </header>

        <section class="hero">
          <div class="hero__copy">
            <p class="hero__eyebrow">Вечер без бесконечного выбора</p>
            <h1 class="hero__title">
              <span class="hero__line">Что</span>
              <span class="hero__line hero__line--accent">смотрим</span>
              <span class="hero__line">сегодня?</span>
            </h1>
          </div>
          <p class="hero__text">
            Лайкай то, что хочется. Если выбирать лень — крути рулетку по
            избранному или по фильтрам.
          </p>
        </section>

        <section class="toolbar" aria-label="Фильтры" id="toolbar"></section>

        <p class="count" id="resultCount"></p>
        <section class="works" id="catalog" aria-live="polite"></section>
      </div>
    </div>

    <div class="modal" id="rouletteModal" hidden>
      <div class="modal__card">
        <button type="button" class="modal__close" id="closeRoulette" aria-label="Закрыть">×</button>
        <h2 class="modal__title">Рулетка</h2>
        <p class="modal__note">Колесо из фильмов в пуле — крутится и останавливается на одном из них.</p>
        <div class="segment" role="group" aria-label="Источник рулетки">
          <button type="button" class="segment__btn is-active" data-source="filters">По фильтрам</button>
          <button type="button" class="segment__btn" data-source="favorites">Из избранного</button>
        </div>
        <p class="modal__pool" id="roulettePool"></p>
        <div class="wheel" id="rouletteStage">
          <div class="wheel__pointer" aria-hidden="true"></div>
          <div class="wheel__disc" id="wheelDisc"></div>
          <div class="wheel__hub">
            <img id="wheelPoster" alt="" hidden />
            <p class="wheel__hint" id="wheelHint">Нажми «Крутить»</p>
            <strong id="wheelTitle" hidden></strong>
          </div>
        </div>
        <div class="modal__actions">
          <button type="button" class="btn btn--primary" id="spinBtn">Крутить</button>
          <a class="btn btn--ghost" id="goMovie" hidden href="#">Открыть фильм</a>
        </div>
      </div>
    </div>

    <script type="module" src="catalog.js?v=5"></script>
  </body>
</html>
