<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Избранное — Сегодня вечером</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,450;9..144,550;9..144,650&family=Syne:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <base href="/tonight-movies/" />
    <link rel="stylesheet" href="styles.css?v=22" />
  </head>
  <body>
    <div class="page">
      <div class="shell">
        <header class="topbar">
          <a class="brand" href="index.html">Сегодня вечером</a>
          <nav class="topnav">
            <a class="navlink" href="index.html">Каталог</a>
            <button type="button" class="navlink" id="openRoulette">Рулетка</button>
          </nav>
        </header>

        <section class="hero hero--simple">
          <div class="hero__copy">
            <p class="hero__eyebrow">Твой список</p>
            <h1 class="hero__title">
              <span class="hero__line">Избранное</span>
            </h1>
            <p class="hero__text hero__text--left">
              Фильмы, которые отметила. Можно крутить рулетку только по ним.
            </p>
          </div>
        </section>

        <p class="count" id="resultCount"></p>
        <section class="works" id="catalog" aria-live="polite"></section>
      </div>
    </div>

    <div class="modal" id="rouletteModal" hidden>
      <div class="modal__card">
        <button type="button" class="modal__close" id="closeRoulette" aria-label="Закрыть">×</button>
        <h2 class="modal__title">Рулетка</h2>
        <p class="modal__note">Крутим только фильмы из избранного.</p>
        <p class="modal__pool" id="roulettePool"></p>
        <div class="reel is-idle" id="rouletteStage">
          <div class="reel__clip">
            <div class="reel__track" id="reelTrack">
              <div class="reel__empty">Нажми «Крутить»</div>
            </div>
          </div>
          <div class="reel__fade" aria-hidden="true"></div>
          <div class="reel__pointer" aria-hidden="true"></div>
        </div>
        <div class="modal__actions">
          <button type="button" class="btn btn--primary" id="spinBtn">Крутить</button>
          <a class="btn btn--ghost" id="goMovie" hidden href="#">Открыть фильм</a>
        </div>
      </div>
    </div>

    <script type="module" src="favorites-page.js?v=22"></script>
  </body>
</html>
